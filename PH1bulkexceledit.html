<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PH1 · ESM+ 상품 엑셀 일괄수정 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f5;--card:#fff;--line:#e2e4e8;--line2:#eef0f3;--text:#222;--sub:#5f6670;--muted:#9aa0a8;
  --blue:#1d6ff2;--blue-d:#1559c9;--blue-bg:#eef4ff;--red:#e5372f;--red-bg:#fff0ef;--green:#11955f;--green-bg:#e9f8f0;
  --amber:#c77700;--amber-bg:#fff6e0;--hdr:#1c1c1c;--th:#f7f8fa;--lock:#f1f2f4;--edit:#fffbea;--chg:#ffe9a8;--xl:#1f7244;
  --shadow:0 8px 30px rgba(20,30,50,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619;--card:#1d2024;--line:#33373d;--line2:#2a2d32;--text:#e9ebee;--sub:#aab1ba;--muted:#7c838c;
  --blue:#4b8dff;--blue-d:#6aa1ff;--blue-bg:#1b2a44;--red:#ff6b63;--red-bg:#3a2220;--green:#3fcf8e;--green-bg:#183327;
  --amber:#ffb44a;--amber-bg:#3a2e17;--hdr:#0d0e10;--th:#24272c;--lock:#26292e;--edit:#2f2a1a;--chg:#5a4a14;--xl:#2c8a57;--shadow:0 8px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141619;--card:#1d2024;--line:#33373d;--line2:#2a2d32;--text:#e9ebee;--sub:#aab1ba;--muted:#7c838c;
  --blue:#4b8dff;--blue-d:#6aa1ff;--blue-bg:#1b2a44;--red:#ff6b63;--red-bg:#3a2220;--green:#3fcf8e;--green-bg:#183327;
  --amber:#ffb44a;--amber-bg:#3a2e17;--hdr:#0d0e10;--th:#24272c;--lock:#26292e;--edit:#2f2a1a;--chg:#5a4a14;--xl:#2c8a57;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.demo-ribbon{background:var(--blue);color:#fff;text-align:center;font-size:12px;padding:5px 10px}
header.top{height:46px;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:22px;padding:0 18px;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px}
header nav{display:flex;gap:16px;color:#c9ccd1;font-size:13px}
header .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:#ddd}
header .right .pill{border:1px solid #5b8dff;color:#8fb2ff;border-radius:10px;padding:0 6px;font-size:10px}
.wrap{display:flex;min-height:calc(100vh - 70px)}
aside.side{width:168px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 12px}
.side h4{margin:6px 0 10px;font-size:13px;display:flex;justify-content:space-between}
.side a{display:block;padding:5px 0;color:var(--sub);text-decoration:none;font-size:12px}
.side a.on{color:var(--blue);font-weight:500}
.side .grp{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-weight:700;font-size:13px;color:var(--text)}
.side .grp div{padding:9px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between}
main{flex:1;min-width:0;padding:18px 22px 60px}
h1{font-size:20px;margin:0 0 14px;letter-spacing:-.4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px}
.stats{display:flex;gap:0;padding:16px 10px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;display:flex;gap:10px;align-items:center;padding:4px 14px}
.stat i{width:34px;height:34px;border-radius:50%;background:var(--lock);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--sub);font-weight:700}
.stat.on i{background:var(--blue);color:#fff}
.stat small{display:block;color:var(--sub);font-size:11px}
.stat b{font-size:17px}.stat.on b{color:var(--blue)}
.filter{margin-top:12px;padding:16px 22px}
.frow{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);gap:20px}
.frow:last-child{border:0}
.frow label{width:90px;color:var(--sub);flex:none}
.frow input[type=text]{width:min(560px,100%);height:32px;border:1px solid var(--line);border-radius:3px;padding:0 10px;background:var(--card)}
.chk{display:flex;gap:16px;flex-wrap:wrap}
.chk span{display:flex;gap:5px;align-items:center}
.list{margin-top:12px;padding:18px 22px}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lhead h2{font-size:15px;margin:0 auto 0 0}.lhead h2 em{font-style:normal;color:var(--blue)}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:3px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b9bec6}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.xl{border-color:var(--xl);color:var(--xl);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.xlicon{width:15px;height:15px;border-radius:2px;background:var(--xl);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.new{background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:0 5px;line-height:14px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .btn{height:30px;font-size:12px}
.toolbar .sp{margin-left:auto}
.dd{position:relative}
.ddmenu{position:absolute;right:0;top:36px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);width:270px;z-index:30;padding:6px;display:none}
.ddmenu.open{display:block}
.ddmenu button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:4px;gap:10px;align-items:flex-start}
.ddmenu button:hover{background:var(--blue-bg)}
.ddmenu .n{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.ddmenu .n.g{background:var(--muted)}
.ddmenu b{display:block;font-weight:500}.ddmenu small{color:var(--sub);font-size:11px}
.ddmenu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.coach{display:flex;gap:10px;align-items:center;background:var(--blue-bg);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:6px;padding:10px 14px;margin-bottom:12px;color:var(--text)}
.coach ol{display:flex;gap:6px;margin:0;padding:0;list-style:none;flex-wrap:wrap}
.coach li{background:var(--card);border-radius:12px;padding:1px 9px;font-size:12px}
.coach .x{margin-left:auto;border:0;background:none;color:var(--sub)}
.tscroll{overflow-x:auto;border-top:2px solid var(--text)}
table.grid{border-collapse:collapse;width:100%;min-width:980px}
table.grid th{background:var(--th);font-weight:500;color:var(--sub);padding:10px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
table.grid td{padding:9px 8px;border-bottom:1px solid var(--line2);text-align:center;font-size:12px;vertical-align:middle}
table.grid td.tl{text-align:left}table.grid td.tr{text-align:right}
.mini{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:11px;margin:0 2px;color:var(--sub)}
.pno{display:flex;gap:4px;align-items:center;justify-content:center}
.pno a{color:var(--blue);text-decoration:underline;font-size:12px}
.site{font-weight:800;font-size:11px}.site.g{color:#14a34a}.site.a{color:#e5372f}
.sub{font-size:11px;color:var(--muted)}
.tag{display:inline-block;border-radius:3px;padding:1px 6px;font-size:11px}
.ch-직접{background:var(--lock);color:var(--sub)}.ch-API{background:var(--blue-bg);color:var(--blue)}.ch-셀링툴{background:var(--amber-bg);color:var(--amber)}
.st-판매가능{color:var(--green)}.st-판매중지{color:var(--sub)}.st-판매불가{color:var(--red)}
.low{color:var(--red);font-weight:700}
tr.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{background:var(--chg)}100%{background:transparent}}
.pager{display:flex;justify-content:center;gap:14px;padding:14px;color:var(--sub)}.pager b{color:var(--blue)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.mbox{background:var(--card);border-radius:10px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.mbox.wide{width:min(1100px,100%)}
.mhead{display:flex;align-items:center;padding:18px 22px 0;gap:18px}
.mhead h3{margin:0;font-size:17px}
.mhead .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--sub)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:12px 22px 0}
.tab{border:0;background:none;padding:8px 0 10px;color:var(--sub);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--blue);border-color:var(--blue);font-weight:700}
.mbody{padding:18px 22px;overflow:auto}
.mfoot{padding:14px 22px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.mfoot .info{margin-right:auto;color:var(--sub);font-size:12px}
.fl{font-weight:700;margin:16px 0 8px;font-size:13px}.fl:first-child{margin-top:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radio{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer}
.radio.on{border-color:var(--blue);background:var(--blue-bg)}
.radio.dis{opacity:.45;cursor:not-allowed}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;background:var(--card)}
.type.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-bg)}
.type b{display:block;font-size:13px}.type small{color:var(--sub);font-size:11px}
.cols{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.cols span{font-size:11px;background:var(--edit);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:3px;padding:0 5px}
.inp{height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;width:100%;background:var(--card)}
.note{background:var(--th);border-radius:6px;padding:10px 12px;color:var(--sub);font-size:12px;margin-top:14px}
.note li{margin:2px 0}
table.hist{width:100%;border-collapse:collapse}
table.hist th{font-weight:500;color:var(--sub);font-size:12px;padding:8px;border-bottom:1px solid var(--line);text-align:left;background:var(--th)}
table.hist td{padding:10px 8px;border-bottom:1px solid var(--line2);font-size:12px}
.bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;width:100px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .2s}
.empty{text-align:center;color:var(--muted);padding:34px 0}

/* sheet (excel sim) */
.xlhead{background:var(--xl);color:#fff;border-radius:10px 10px 0 0;padding:10px 18px;display:flex;align-items:center;gap:10px}
.xlhead b{font-weight:500}
.xlhead .x{margin-left:auto;border:0;background:none;color:#fff;font-size:22px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--sub);padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.sheetwrap{overflow:auto;max-height:56vh}
table.sheet{border-collapse:collapse;font-size:12px;min-width:100%}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:0;height:30px;white-space:nowrap}
table.sheet thead th{background:var(--th);font-weight:500;color:var(--sub);padding:0 8px;position:sticky;top:0;z-index:1}
table.sheet thead tr.letters th{height:20px;font-size:10px;color:var(--muted);font-weight:400;top:0}
table.sheet thead tr.names th{top:20px}
table.sheet thead th.ed{background:var(--edit);color:var(--text)}
table.sheet td.rn{background:var(--th);color:var(--muted);text-align:center;width:34px;font-size:11px}
table.sheet td.lk{background:var(--lock);color:var(--sub);padding:0 8px}
table.sheet td.ed input{border:0;background:transparent;height:30px;padding:0 8px;width:100%;min-width:90px}
table.sheet td.ed.name input{min-width:260px}
table.sheet td.ed.chg{background:var(--chg)}
table.sheet td.ed input:focus{outline:2px solid var(--xl);outline-offset:-2px}

/* upload steps */
.steps{display:flex;gap:0;margin:16px 22px 0}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--muted);padding-bottom:8px;border-bottom:3px solid var(--line2)}
.steps div.on{color:var(--blue);border-color:var(--blue);font-weight:700}
.steps div.done{color:var(--text);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--sub)}
.filecard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px;text-align:left}
.filecard .ic{width:34px;height:40px;background:var(--xl);border-radius:4px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.filecard div{flex:1}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum div{border-radius:8px;padding:12px;background:var(--th)}
.sum b{display:block;font-size:20px}
.sum .e{background:var(--red-bg)}.sum .e b{color:var(--red)}
.sum .w{background:var(--amber-bg)}.sum .w b{color:var(--amber)}
.sum .o{background:var(--green-bg)}.sum .o b{color:var(--green)}
.issue td{vertical-align:top}
.lv{font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;white-space:nowrap}
.lv.err{background:var(--red-bg);color:var(--red)}.lv.warn{background:var(--amber-bg);color:var(--amber)}.lv.ok{background:var(--green-bg);color:var(--green)}
.diff{font-size:12px}.diff s{color:var(--muted)}.diff b{font-weight:500}
.msgs div{font-size:12px}.msgs .err{color:var(--red)}.msgs .warn{color:var(--amber)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:2px 10px;font-size:12px}
.seg button.on{background:var(--text);color:var(--card);border-color:var(--text)}
.bigbar{height:10px;background:var(--line2);border-radius:5px;overflow:hidden;margin:18px 0 8px}
.bigbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .15s}
.result{text-align:center;padding:10px 0 4px}
.result h4{font-size:19px;margin:8px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 18px;border-radius:8px;opacity:0;transition:.25s;z-index:99;font-size:13px;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){aside.side{display:none}header nav{display:none}.types{grid-template-columns:1fr}.sum{grid-template-columns:1fr 1fr}main{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* language switcher */
html[lang="zh-CN"] body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans KR",sans-serif}
.lang{position:relative}
.langbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border:1px solid #4a4e55;border-radius:14px;background:transparent;color:#eceef1;font-size:12px}
.langbtn:hover,.langbtn[aria-expanded="true"]{border-color:#8fb2ff;color:#fff}
.langbtn svg{width:16px;height:16px;flex:none}
.langbtn .car{font-size:9px;opacity:.7}
.langmenu{position:absolute;right:0;top:36px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;min-width:168px;display:none;z-index:40}
.langmenu.open{display:block}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:5px;text-align:left;font-size:13px}
.langmenu button:hover{background:var(--blue-bg)}
.langmenu button small{color:var(--muted);font-size:11px}
.langmenu button[aria-checked="true"]{color:var(--blue);font-weight:700}
.langmenu button[aria-checked="true"] small::before{content:"✓ ";color:var(--blue)}
@media (max-width:760px){header .right .hm{display:none}}
/* 모달이 열려 있어도 언어를 바꿀 수 있도록 헤더를 모달 위로 */
header.top{z-index:55}
.modal{padding-top:84px}
.mbox{max-height:calc(100vh - 104px)}
</style>
</head>
<body>
<div class="demo-ribbon" data-i18n="ribbon"></div>
<header class="top">
  <div class="logo">ESM PLUS</div>
  <nav><span data-i18n="nav.0"></span><span data-i18n="nav.1"></span><span data-i18n="nav.2"></span><span data-i18n="nav.3"></span></nav>
  <div class="right">
    <span class="pill" data-i18n="master"></span><span><b>test4plan</b><span data-i18n="sir"></span></span>
    <span class="hm" data-i18n="logout"></span><span class="hm" data-i18n="help"></span><span class="hm" data-i18n="cs"></span>
    <div class="lang">
      <button class="langbtn" id="langBtn" aria-haspopup="true" aria-expanded="false" data-i18n-aria="langAria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span id="langCur">한국어</span><span class="car">▾</span>
      </button>
      <div class="langmenu" id="langMenu" role="menu">
        <button role="menuitemradio" data-lang="ko">한국어<small>KO</small></button>
        <button role="menuitemradio" data-lang="zh">简体中文<small>ZH</small></button>
        <button role="menuitemradio" data-lang="en">English<small>EN</small></button>
      </div>
    </div>
  </div>
</header>
<div class="wrap">
  <aside class="side">
    <h4><span data-i18n="sideTitle"></span><span>⌃</span></h4>
    <a class="on" data-i18n="side.0"></a><a data-i18n="side.1"></a><a data-i18n="side.2"></a><a data-i18n="side.3"></a><a data-i18n="side.4"></a><a data-i18n="side.5"></a><a data-i18n="side.6"></a><a data-i18n="side.7"></a><a data-i18n="side.8"></a><a data-i18n="side.9"></a>
    <div class="grp"><div><span data-i18n="grp.0"></span><span>⌄</span></div><div><span data-i18n="grp.1"></span><span>⌄</span></div><div><span data-i18n="grp.2"></span><span>⌄</span></div><div><span data-i18n="grp.3"></span><span>⌄</span></div><div><span data-i18n="grp.4"></span><span>⌄</span></div><div><span data-i18n="grp.5"></span><span>⌄</span></div></div>
  </aside>
  <main>
    <h1 data-i18n="h1"></h1>
    <div class="card stats" id="stats"></div>
    <div class="card filter">

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
function openM(id){$(id).classList.add('open')}
function closeM(el){el.closest('.modal').classList.remove('open')}
const isOpen=id=>$(id).classList.contains('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeM(b));

/* ---------- 언어 전환 ---------- */
function applyStatic(){
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
 document.querySelectorAll('[data-tv]').forEach(el=>el.textContent=tv(el.dataset.tv));
}
function renderStats(){
 const N=['16,858','7','9','186','673','15,991'],ic=t('statIc'),u=t('unit');
 $('#stats').innerHTML=t('stats').map((l,i)=>`<div class="stat ${i?'':'on'}"><i>${ic[i]}</i><div><small>${l}</small><b>${N[i]}</b>${u}</div></div>`).join('');
}
function syncFileNames(){
 // 상품명 파일: 수정하지 않은 칸은 새 언어의 상품명으로 바꾸고, 수정한 칸은 그대로 둬요
 files.forEach(f=>{if(f.type!=='info'||f.lang===lang)return;
  f.rows.forEach(r=>{const p=P.find(x=>x.id===r.pid),nn=p.name[lang];if(r.cur.name===r.orig.name)r.cur.name=nn;r.orig.name=nn});
  f.lang=lang});
}
function setLang(l,save=true){
 if(!I18N[l])l='ko';lang=l;
 document.documentElement.lang=LANGS[l].html;
 document.title=t('title');
 $('#langCur').textContent=LANGS[l].short;
 document.querySelectorAll('#langMenu [data-lang]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.lang===l)));
 syncFileNames();
 applyStatic();renderStats();
 $('#listTitle').innerHTML=t('listTitle','14,884');
 renderTable();
 if(isOpen('#mDown')){const fi=$('#fname');if(curTab==='req'&&fi&&fi.value!==defName())down.fname=fi.value;setTab(curTab)}
 if(isOpen('#mSheet')&&sheet)renderSheet();
 if(isOpen('#mUp'))renderUp();
 if(save){try{localStorage.setItem('esm-demo-lang',l)}catch(e){}}
}
function closeLang(){$('#langMenu').classList.remove('open');$('#langBtn').setAttribute('aria-expanded','false')}
$('#langBtn').onclick=e=>{e.stopPropagation();$('#ddMenu').classList.remove('open');const m=$('#langMenu');m.classList.toggle('open');$('#langBtn').setAttribute('aria-expanded',m.classList.contains('open'))};
$('#langMenu').onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-lang]');if(!b)return;setLang(b.dataset.lang);closeLang();$('#langBtn').focus()};

/* ---------- 목록 ---------- */

 $('#tbody').innerHTML=P.map(p=>{

  return `<tr class="${flash.has(p.id)?'flash':''}">
  <td><input type="checkbox" data-id="${p.id}" ${sel.has(p.id)?'checked':''} aria-label="${esc(t('selectItem',nm))}"></td>
  <td><span class="mini">${t('edit')}</span><span class="mini">${t('copy')}</span></td>
  <td><div class="pno"><span class="site g">G</span><a>${p.id}</a></div><div class="pno"><span class="site a">A</span><a>${p.aid}</a></div></td>
  <td class="tl">${esc(nm)}${p.opts?`<div class="sub">${t('optCount',p.opts.length)} · ${p.opts.map(o=>esc(L(o.n))+' '+(o.use==='품절'?tv('품절'):fmt(o.stock))).join(' / ')}</div>`:''}</td>
  <td><span class="tag ch-${p.ch}" ${p.ch==='셀링툴'?`title="${esc(t('chTip'))}"`:''}>${tv(p.ch)}</span></td>

  <td class="${stock<=10?'low':''}">${p.opts?t('optStock'):''}${fmt(stock)}</td>
  <td class="st-${p.status}">${tv(p.status)}</td>
  <td>${tv(p.ship)}</td><td>${p.fee?fmt(p.fee):t('free')}</td><td>${p.code}</td></tr>`}).join('');

 $('#chkAll').checked=sel.size===P.length;

$('#tbody').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?sel.add(id):sel.delete(id);$('#selInfo').textContent=t('selInfo',sel.size);$('#chkAll').checked=sel.size===P.length});
$('#chkAll').onchange=e=>{sel=e.target.checked?new Set(P.map(p=>p.id)):new Set();renderTable()};

/* ---------- 드롭다운 ---------- */
$('#ddBtn').onclick=e=>{e.stopPropagation();closeLang();const m=$('#ddMenu');m.classList.toggle('open');$('#ddBtn').setAttribute('aria-expanded',m.classList.contains('open'))};
document.addEventListener('click',()=>{$('#ddMenu').classList.remove('open');closeLang()});
$('#ddMenu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;

/* ---------- 파일 받기 / 작업 내역 ---------- */
function openDown(tab){openM('#mDown');setTab(tab)}
document.querySelectorAll('#mDown .tab').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));
function setTab(x){curTab=x;document.querySelectorAll('#mDown .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===x));x==='req'?renderReq():renderHist()}
function defName(){return `${TYPES[down.type].file}_${TODAY}`}
function renderReq(){
 const n=sel.size;
 $('#downBody').innerHTML=`
  <div class="fl">${t('qTarget')}</div>
  <div class="radios">
   <label class="radio ${down.target==='sel'?'on':''} ${n?'':'dis'}"><input type="radio" name="tg" value="sel" ${down.target==='sel'?'checked':''} ${n?'':'disabled'}>${t('selN',n)}</label>
   <label class="radio ${down.target==='all'?'on':''}"><input type="radio" name="tg" value="all" ${down.target==='all'?'checked':''}>${t('allN','14,884')}</label>
  </div>
  ${n?'':`<div class="sub" style="margin-top:6px">${t('selHint')}</div>`}
  <div class="fl">${t('qType')}</div>
  <div class="types">${Object.keys(TYPES).map(k=>`<button type="button" class="type ${down.type===k?'on':''}" data-type="${k}"><b>${tl(k)}</b><small>${td(k)}</small><div class="cols">${TYPES[k].cols.map(c=>`<span>${cl(c)}</span>`).join('')}</div></button>`).join('')}</div>
  <div class="fl">${t('fname')}</div>
  <input class="inp" id="fname" value="${esc(down.fname||defName())}">
  <ul class="note">${t('notes').map(x=>`<li>${x}</li>`).join('')}</ul>`;
 $('#downFoot').innerHTML=`<span class="info">${t('downInfo')}</span><button class="btn" data-close2>${t('close')}</button><button class="btn pri" id="reqBtn">${t('makeFile')}</button>`;
 $('#downBody').querySelectorAll('input[name=tg]').forEach(r=>r.onchange=()=>{down.target=r.value;down.fname=$('#fname').value;renderReq()});
 $('#downBody').querySelectorAll('.type').forEach(b=>b.onclick=()=>{const keep=$('#fname').value!==defName();down.type=b.dataset.type;down.fname=keep?$('#fname').value:'';renderReq()});
 $('#downFoot [data-close2]').onclick=()=>$('#mDown').classList.remove('open');
 $('#reqBtn').onclick=()=>{
  const ids=down.target==='sel'?P.filter(p=>sel.has(p.id)).map(p=>p.id):P.map(p=>p.id);
  const job={id:jobSeq++,kind:'down',type:down.type,ids,name:($('#fname').value.trim()||defName())+'.xlsx',status:'making',pct:0,time:now(),count:ids.length};
  jobs.unshift(job);down.fname='';setTab('hist');
  const iv=setInterval(()=>{job.pct=Math.min(100,job.pct+9+Math.random()*14);if(job.pct>=100){job.status='done';clearInterval(iv);toast(t('fileReady',job.name))}if(curTab==='hist'&&isOpen('#mDown'))renderHist()},220);
 };
}
function now(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function renderHist(){
 const th=t('histTh');
 $('#downBody').innerHTML=jobs.length?`<table class="hist"><thead><tr>${th.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${jobs.map(j=>`<tr>
  <td>${j.time}</td><td>${t(j.kind==='down'?'kindDown':'kindUp')}</td><td>${esc(j.name)}<div class="sub">${t('countN',j.count)}</div></td><td>${tl(j.type)}</td>
  <td>${j.kind==='down'?(j.status==='done'?`<span class="lv ok">${t('done')}</span>`:`<div class="bar"><i style="width:${j.pct}%"></i></div><span class="sub">${t('making')}</span>`):`<span class="lv ${j.fail?'warn':'ok'}">${t('okFail',j.ok,j.fail)}</span>`}</td>
  <td>${j.kind==='down'?`<button class="btn" data-open="${j.id}" ${j.status==='done'?'':'disabled'}>${t('open')}</button>`:`<button class="btn" data-res="${j.id}">${t('viewRes')}</button>`}</td></tr>`).join('')}</tbody></table>`
  :`<div class="empty">${t('histEmpty')}<br><button class="btn pri" style="margin-top:12px" onclick="setTab('req')">${t('goDown')}</button></div>`;
 $('#downFoot').innerHTML=`<span class="info">${t('histInfo')}</span><button class="btn" onclick="$('#mDown').classList.remove('open')">${t('close')}</button>`;
 $('#downBody').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(jobs.find(j=>j.id==b.dataset.open)));
 $('#downBody').querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{const j=jobs.find(x=>x.id==b.dataset.res);$('#mDown').classList.remove('open');up={step:3,file:j.file,val:j.val,filter:'all',done:true};openM('#mUp');renderUp()});
}

/* ---------- 엑셀 시뮬레이션 ---------- */
function getVal(p,r,k,fl){if(k==='name')return p.name[fl]||p.name.ko;return r.oi!=null?p.opts[r.oi][k]:p[k]}
function buildRows(type,ids){
 const rows=[];
 ids.forEach(id=>{const p=P.find(x=>x.id===id);
  if(type==='option'){if(!p.opts)return;p.opts.forEach((o,oi)=>{const v={};TYPES.option.cols.forEach(c=>v[c.k]=String(o[c.k]));rows.push({pid:id,oi,opt:o.n,orig:{...v},cur:{...v}})})}
  else{const v={};TYPES[type].cols.forEach(c=>v[c.k]=String(getVal(p,{oi:null},c.k,lang)));rows.push({pid:id,oi:null,orig:{...v},cur:{...v}})}
 });
 return rows;
}
function openSheet(job){
 let f=files.find(x=>x.jobId===job.id);
 if(!f){f={jobId:job.id,name:job.name,type:job.type,lang,rows:buildRows(job.type,job.ids),saved:false};files.push(f)}
 sheet=f;$('#mDown').classList.remove('open');$('#sheetName').textContent=f.name;renderSheet();openM('#mSheet');
}
/* 정해진 값 열: 어떤 언어로 입력해도 같은 값으로 인식해요 */
function normSel(c,typed){const s=typed.trim().toLowerCase();for(const o of c.o){if(o.toLowerCase()===s)return o;if(V[o]&&Object.values(V[o]).some(x=>x.toLowerCase()===s))return o}return typed}
const cellShow=(c,v)=>c.t==='sel'&&V[v]?tv(v):v;
const LET='ABCDEFGHIJ';
function renderSheet(){
 const f=sheet,tp=TYPES[f.type];
 if(!f.rows.length){$('#sheetWrap').innerHTML=`<div class="empty">${t('sheetEmpty')}</div>`;updCount();return}
 const lock=[t('lockPid'),t('lockName')].concat(f.type==='option'?[t('lockOpt')]:[]).concat([t('lockCh')]);
 const all=lock.length+tp.cols.length;
 $('#sheetWrap').innerHTML=`<table class="sheet"><thead>
  <tr class="letters"><th></th>${[...Array(all)].map((_,i)=>`<th>${LET[i]}</th>`).join('')}</tr>
  <tr class="names"><th>1</th>${lock.map(l=>`<th>${l}</th>`).join('')}${tp.cols.map(c=>`<th class="ed">${cl(c)}${c.t==='sel'?`<div class="sub">${c.o.map(tv).join(' / ')}</div>`:''}</th>`).join('')}</tr></thead>
  <tbody>${f.rows.map((r,i)=>{const p=P.find(x=>x.id===r.pid),nm=L(p.name);return `<tr><td class="rn">${i+2}</td><td class="lk">${r.pid}</td><td class="lk">${esc(nm)}</td>${r.opt?`<td class="lk">${esc(L(r.opt))}</td>`:''}<td class="lk">${tv(p.ch)}</td>
   ${tp.cols.map(c=>`<td class="ed ${c.k==='name'?'name':''} ${r.cur[c.k]!==r.orig[c.k]?'chg':''}"><input data-r="${i}" data-k="${c.k}" value="${esc(cellShow(c,r.cur[c.k]))}" ${c.t==='sel'?`list="dl-${c.k}"`:''} aria-label="${esc(nm+' '+cl(c))}"></td>`).join('')}</tr>`}).join('')}</tbody></table>
  ${tp.cols.filter(c=>c.t==='sel').map(c=>`<datalist id="dl-${c.k}">${c.o.map(o=>`<option value="${esc(tv(o))}">`).join('')}</datalist>`).join('')}`;
 $('#sheetWrap').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const r=f.rows[inp.dataset.r],k=inp.dataset.k,c=tp.cols.find(x=>x.k===k);r.cur[k]=c.t==='sel'?normSel(c,inp.value):inp.value;inp.parentNode.classList.toggle('chg',r.cur[k]!==r.orig[k]);updCount()});
 updCount();
}
function updCount(){let n=0;sheet.rows.forEach(r=>Object.keys(r.cur).forEach(k=>{if(r.cur[k]!==r.orig[k])n++}));$('#chgCount').textContent=t('chg',n)}
$('#fillSample').onclick=()=>{(SAMPLES[sheet.type]||[]).forEach(([i,k,v])=>{if(sheet.rows[i])sheet.rows[i].cur[k]=L(v)});renderSheet();toast(t('toastSample'))};
$('#saveSheet').onclick=()=>{sheet.saved=true;up={step:1,file:sheet,val:null,filter:'all'};$('#mSheet').classList.remove('open');toast(t('toastSaved'))};

/* ---------- 업로드 ---------- */
function openUp(){if(up.step!==1){up={step:1,file:up.file,val:null,filter:'all'}}openM('#mUp');renderUp()}
function stepUI(){document.querySelectorAll('#upSteps div').forEach((d,i)=>{d.className=i+1===up.step?'on':(i+1<up.step?'done':'')})}
function renderUp(){
 stepUI();const b=$('#upBody'),ft=$('#upFoot');
 if(up.step===1){
  const ready=files.filter(f=>f.saved);
  b.innerHTML=`<div class="drop"><div style="font-size:15px;color:var(--text);font-weight:500">${t('dropT')}</div><div class="sub" style="margin:4px 0 12px">${t('dropS')}</div><button class="btn" id="pcPick">${t('pcPick')}</button></div>
   ${ready.length?`<div class="fl" style="margin-top:18px">${t('savedFiles')}</div>${ready.map(f=>{const n=f.rows.filter(r=>Object.keys(r.cur).some(k=>r.cur[k]!==r.orig[k])).length;return `<label class="filecard"><input type="radio" name="uf" value="${files.indexOf(f)}" ${up.file===f?'checked':''}><span class="ic">XLS</span><div><b>${esc(f.name)}</b><div class="sub">${t('fileMeta',tl(f.type),f.rows.length,n)}</div></div></label>`}).join('')}`
   :`<div class="note">${t('noSaved')} <button class="btn" style="margin-left:6px" id="goDown">${t('goDown')}</button></div>`}`;
  ft.innerHTML=`<span class="info">${t('upInfo')}</span><button class="btn" onclick="$('#mUp').classList.remove('open')">${t('cancel')}</button><button class="btn pri" id="valBtn" ${up.file&&up.file.saved?'':'disabled'}>${t('checkErr')}</button>`;
  $('#pcPick').onclick=()=>toast(t('pcToast'));
  const g=$('#goDown');if(g)g.onclick=()=>{$('#mUp').classList.remove('open');down.target=sel.size?'sel':'all';openDown('req')};
  b.querySelectorAll('input[name=uf]').forEach(r=>r.onchange=()=>{up.file=files[r.value];renderUp()});
  $('#valBtn').onclick=()=>{up.step=2;up.val=null;renderUp();setTimeout(()=>{up.val=validate(up.file);renderUp()},900)};
 }
 else if(up.step===2){
  if(!up.val){b.innerHTML=`<div class="empty">${t('checking',up.file.rows.length)}<div class="bigbar" style="width:240px;margin:14px auto"><i style="width:70%"></i></div></div>`;ft.innerHTML='';return}
  const v=up.val,e=v.res.filter(x=>x.lv==='err').length,w=v.res.filter(x=>x.lv==='warn').length,o=v.res.filter(x=>x.lv==='ok').length;
  if(!v.res.length){b.innerHTML=`<div class="empty">${t('noChange')}</div>`;ft.innerHTML=`<button class="btn" id="back1">${t('rePick')}</button>`;$('#back1').onclick=()=>{up.step=1;renderUp()};return}
  const list=v.res.filter(x=>up.filter==='all'||x.lv===up.filter);
  b.innerHTML=`<div class="sum"><div><span class="sub">${t('sChanged')}</span><b>${v.res.length}</b></div><div class="e"><span class="sub">${t('sErr')}</span><b>${e}</b></div><div class="w"><span class="sub">${t('sWarn')}</span><b>${w}</b></div><div class="o"><span class="sub">${t('sOk')}</span><b>${o}</b></div></div>
   <div class="seg">${['all','err','warn','ok'].map(k=>`<button class="${up.filter===k?'on':''}" data-f="${k}">${t('seg.'+k)}</button>`).join('')}<span class="sub" style="margin-left:auto">${t('skipN',v.unchanged)}</span></div>
   ${issueTable(list)}`;
  b.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{up.filter=x.dataset.f;renderUp()});
  ft.innerHTML=`<span class="info">${t('footInfo',e,w+o)}</span><button class="btn" id="reEdit">${t('reEdit')}</button><button class="btn pri" id="applyBtn" ${w+o?'':'disabled'}>${t('applyBtn',e,w+o)}</button>`;
  $('#reEdit').onclick=()=>{$('#mUp').classList.remove('open');sheet=up.file;$('#sheetName').textContent=sheet.name;renderSheet();openM('#mSheet')};
  $('#applyBtn').onclick=()=>{up.step=3;up.pct=0;renderUp();const iv=setInterval(()=>{up.pct+=12+Math.random()*12;if(up.pct>=100){clearInterval(iv);apply()}const i=$('#upBody .bigbar i');if(i)i.style.width=Math.min(100,up.pct)+'%'},160)};
 }
 else if(up.step===3){
  if(!up.done){b.innerHTML=`<div class="result"><div class="sub">${t('applying')}</div><div class="bigbar"><i style="width:${Math.min(100,up.pct||0)}%"></i></div></div>`;ft.innerHTML=`<button class="btn" onclick="$('#mUp').classList.remove('open')">${t('closeLater')}</button>`;return}
  const v=up.val,ok=v.res.filter(x=>x.lv!=='err'),bad=v.res.filter(x=>x.lv==='err');
  b.innerHTML=`<div class="result"><div style="font-size:30px">${bad.length?'⚠️':'✅'}</div><h4>${t('resTitle',ok.length,bad.length)}</h4><div class="sub">${esc(up.file.name)} · ${tl(up.file.type)}</div></div>
   <div class="sum" style="margin-top:14px"><div class="o"><span class="sub">${t('rOk')}</span><b>${ok.length}</b></div><div class="e"><span class="sub">${t('rFail')}</span><b>${bad.length}</b></div><div class="w"><span class="sub">${t('rWarn')}</span><b>${ok.filter(x=>x.lv==='warn').length}</b></div><div><span class="sub">${t('rSkip')}</span><b>${v.unchanged}</b></div></div>
   ${bad.length?`<div class="fl">${t('failList')}</div>${issueTable(bad)}`:''}`;
  ft.innerHTML=`${bad.length?`<button class="btn" id="failDl">${t('failDl')}</button>`:''}<button class="btn pri" onclick="$('#mUp').classList.remove('open')">${t('viewList')}</button>`;
  const fd=$('#failDl');if(fd)fd.onclick=()=>{const ids=[...new Set(bad.map(x=>x.r.pid))];const job={id:jobSeq++,kind:'down',type:up.file.type,ids,name:`${t('failPrefix')}${up.file.name}`,status:'done',pct:100,time:now(),count:ids.length};jobs.unshift(job);$('#mUp').classList.remove('open');openSheet(job);toast(t('failToast'))};
 }
}
function issueTable(list){
 return `<div style="overflow-x:auto"><table class="hist issue"><thead><tr>${t('issueTh').map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${list.map(x=>`<tr>
  <td><span class="lv ${x.lv}">${t('lv.'+x.lv)}</span></td>
  <td>${esc(L(x.p.name))}${x.r.opt?` <span class="sub">· ${esc(L(x.r.opt))}</span>`:''}<div class="sub">${x.r.pid} · ${tv(x.p.ch)}</div></td>
  <td class="diff">${x.changes.map(c=>`<div>${cl(c)} <s>${show(c,x.r.orig[c.k])}</s> → <b>${show(c,x.r.cur[c.k])}</b></div>`).join('')}</td>
  <td class="msgs">${x.issues.length?x.issues.map(i=>`<div class="${i.lv}">${i.m()}</div>`).join(''):`<span class="sub">${t('noIssue')}</span>`}</td></tr>`).join('')}</tbody></table></div>`;
}
function show(c,v){v=String(v);if(v.trim()==='')return t('blank');if(c.t==='num'&&/^-?\d+$/.test(v.trim()))return fmt(v.trim());if(c.t==='sel'&&V[v])return tv(v);return esc(v)}
/* 검증 메시지는 함수로 담아 두고, 화면에 그릴 때 현재 언어로 만들어요 */
function validate(f){
 const tp=TYPES[f.type],res=[];let unchanged=0;
 f.rows.forEach(r=>{
  const p=P.find(x=>x.id===r.pid);
  const changes=tp.cols.filter(c=>r.cur[c.k].trim()!==r.orig[c.k]);
  if(!changes.length){unchanged++;return}
  const issues=[],add=(lv,m)=>issues.push({lv,m});
  if(p.status==='판매불가')add('err',()=>t('v.blocked'));
  changes.forEach(c=>{
   const v=r.cur[c.k].trim(),live=String(getVal(p,r,c.k,f.lang));
   if(live!==r.orig[c.k])add('warn',()=>t('v.stale',cl(c),show(c,live)));
   if(c.t==='num'){
    if(!/^-?\d+$/.test(v)){add('err',()=>t('v.numOnly',cl(c)));return}
    const n=+v,o=+r.orig[c.k];
    if(c.k==='price'){if(n<10)add('err',()=>t('v.priceMin'));else if(n%10)add('err',()=>t('v.priceUnit'));else if(n>o*1.5){const pc=Math.round((n/o-1)*100);add('warn',()=>t('v.priceUp',pc))}else if(n<o*.3){const pc=Math.round((1-n/o)*100);add('warn',()=>t('v.priceDown',pc))}}
    if(c.k==='stock'&&(n<0||n>99999))add('err',()=>t('v.stockRange'));
    if(c.k==='fee'){if(n<0)add('err',()=>t('v.feeMin'));else if(n%10)add('err',()=>t('v.feeUnit'))}
    if(c.k==='add'){const lo=-Math.floor(p.price*.5),hi=p.price;if(n<lo||n>hi)add('err',()=>t('v.addRange',fmt(lo),fmt(hi)));else if(n%10)add('err',()=>t('v.addUnit'))}
   }
   if(c.t==='sel'&&!c.o.includes(v))add('err',()=>t('v.badVal',cl(c),esc(v),c.o.map(tv).join(t('sep'))));
   if(c.k==='name'){if(!v)add('err',()=>t('v.nameEmpty'));else if(v.length>100)add('err',()=>t('v.nameLong'));else if(p.sold)add('warn',()=>t('v.nameReview'))}
   if(c.k==='code'&&v.length>50)add('err',()=>t('v.codeLong'));
   if(c.k==='use'&&v==='사용'&&f.type==='option'&&+r.cur.stock===0)add('warn',()=>t('v.useZero',tv('사용')));
  });
  if(p.ch!=='직접'&&!issues.some(i=>i.lv==='err'))add('warn',()=>t('v.synced',p.ch));
  const lv=issues.some(i=>i.lv==='err')?'err':issues.length?'warn':'ok';
  res.push({r,p,changes,issues,lv});
 });
 res.sort((a,b)=>({err:0,warn:1,ok:2}[a.lv]-{err:0,warn:1,ok:2}[b.lv]));
 return {res,unchanged};
}
function apply(){
 const v=up.val,flash=new Set();
 v.res.filter(x=>x.lv!=='err').forEach(x=>{
  x.changes.forEach(c=>{let val=x.r.cur[c.k].trim();if(c.t==='num')val=+val;
   if(c.k==='name'){if(!x.p.sold)x.p.name={ko:val,zh:val,en:val};return}
   if(x.r.oi!=null)x.p.opts[x.r.oi][c.k]=val;else x.p[c.k]=val});
  flash.add(x.p.id);
 });
 const bad=v.res.filter(x=>x.lv==='err').length;
 jobs.unshift({id:jobSeq++,kind:'up',type:up.file.type,name:up.file.name,count:v.res.length,ok:v.res.length-bad,fail:bad,time:now(),file:up.file,val:v});
 up.done=true;renderUp();renderTable(flash);
 toast(t('applyToast',v.res.length-bad,bad));
}

/* ---------- 시작 언어: #zh·#en 링크 > 마지막 선택 > 브라우저 언어(중국어) > 한국어 ---------- */
(function(){
 const h=(location.hash||'').slice(1).toLowerCase();let s=null;
 try{s=localStorage.getItem('esm-demo-lang')}catch(e){}
 const nav=(navigator.language||'').toLowerCase();
 setLang(I18N[h]?h:(s&&I18N[s]?s:(nav.startsWith('zh')?'zh':'ko')),false);
})();
</script>
