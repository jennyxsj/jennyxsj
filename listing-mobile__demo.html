<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PH2 · 모바일 상품관리 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e9ecf1;--bg:#f4f5f7;--card:#fff;--line:#e8eaee;--text:#191f28;--sub:#6b7684;--muted:#a3abb5;
  --blue:#1d6ff2;--blue-bg:#e9f1ff;--red:#f04438;--red-bg:#ffefed;--green:#0e9f6e;--green-bg:#e6f7ef;--amber:#c27400;--amber-bg:#fff4dc;
  --dim:rgba(14,20,30,.45);--chip:#f0f2f5;--sk:#eceef1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#0f1113;--bg:#141619;--card:#1e2125;--line:#2c3036;--text:#eceef1;--sub:#a1a9b3;--muted:#6f7780;
  --blue:#4c8dff;--blue-bg:#1a2a45;--red:#ff6a5f;--red-bg:#3b2120;--green:#3fd08f;--green-bg:#17332a;--amber:#ffb84d;--amber-bg:#3b2e15;--chip:#2a2e33;--sk:#262a2f;--dim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1113;--bg:#141619;--card:#1e2125;--line:#2c3036;--text:#eceef1;--sub:#a1a9b3;--muted:#6f7780;
  --blue:#4c8dff;--blue-bg:#1a2a45;--red:#ff6a5f;--red-bg:#3b2120;--green:#3fd08f;--green-bg:#17332a;--amber:#ffb84d;--amber-bg:#3b2e15;--chip:#2a2e33;--sk:#262a2f;--dim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 24px 24px}
html[lang^="zh"] body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans KR",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* language switch */
.langbar{display:flex;gap:2px;background:var(--card);border-radius:12px;padding:4px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.langbar button{height:34px;padding:0 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--sub)}
.langbar button.on{background:var(--text);color:var(--card)}
.stage{display:flex;align-items:center;justify-content:center;gap:40px;min-height:0}

.phone{width:390px;height:min(820px,calc(100vh - 100px));background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px #1b1d21,0 30px 60px rgba(0,0,0,.25);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}
.sbar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:700;background:var(--card);flex:none}
.screen{flex:1;min-height:0;display:none;flex-direction:column;position:relative}
.screen.on{display:flex}
.apphead{background:var(--card);padding:6px 18px 10px;flex:none}
.apphead .row{display:flex;align-items:center;gap:8px}
.apphead h1{font-size:21px;margin:0;letter-spacing:-.5px}
.acct{margin-left:auto;font-size:12px;color:var(--sub);background:var(--chip);border-radius:14px;padding:4px 10px;white-space:nowrap}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px;height:44px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:15px}
.search .clr{color:var(--muted);font-size:16px;display:none}
.search.has .clr{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:18px;border:1px solid var(--line);padding:6px 12px;font-size:13px;background:var(--card);white-space:nowrap}
.chip b{font-weight:500;color:var(--sub);margin-left:3px;font-size:12px}
.chip.on{background:var(--text);color:var(--card);border-color:var(--text)}
.chip.on b{color:var(--card);opacity:.75}
.chip.warn:not(.on){color:var(--red)}
.lbar{display:flex;align-items:center;padding:10px 18px;font-size:13px;color:var(--sub);flex:none;gap:10px}
.lbar b{color:var(--text)}
.lbar .r{margin-left:auto;display:flex;gap:12px}
.lbar button{color:var(--sub);font-size:13px}
.lbar .selbtn{color:var(--blue);font-weight:500}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 90px}
.needdesc{font-size:12.5px;color:var(--sub);padding:0 6px 8px;margin-top:-4px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.item:active{transform:scale(.99)}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.95);font-size:15px}
.item .info{flex:1;min-width:0}
.item .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edtag{font-size:10px;font-weight:500;color:var(--blue);background:var(--blue-bg);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:1px}
.item .meta .s{font-weight:800;font-size:10px}.s.g{color:#16a34a}.s.a{color:#e5372f}
.item .bot{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:12px}
.pill{border-radius:6px;padding:1px 7px;font-size:11px;font-weight:500;background:var(--chip);color:var(--sub);white-space:nowrap}
.pill.on{background:var(--green-bg);color:var(--green)}
.pill.stop{background:var(--chip);color:var(--sub)}
.pill.low{background:var(--red-bg);color:var(--red)}
.pill.out{background:var(--red);color:#fff}
.item .price{margin-left:auto;font-weight:700;font-size:13px;white-space:nowrap}
.cbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:none;place-items:center;color:#fff;font-size:12px}
.selmode .cbox{display:grid}
.item.sel .cbox{background:var(--blue);border-color:var(--blue)}
.item.sel{box-shadow:inset 0 0 0 1.5px var(--blue)}
.sk{height:76px;border-radius:14px;background:var(--sk);margin-bottom:8px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.5}}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:14px 10px 4px;line-height:1.6}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.recent{padding:6px 18px}
.recent h5{margin:12px 0 8px;font-size:13px;color:var(--sub);font-weight:500}
.recent .tags{display:flex;gap:6px;flex-wrap:wrap}
.recent .tags button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:13px}
.hint{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;color:var(--sub);line-height:1.6}
.hint b{color:var(--text);font-weight:500}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:14px;z-index:5}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);gap:2px;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--text);font-weight:700}
.tabbar .dot{position:absolute;top:8px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:9px;border-radius:8px;padding:0 4px;min-width:15px;line-height:15px}
.actbar{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 24px;display:none;gap:8px;z-index:6}
.actbar.on{display:flex}
.actbar button{flex:1;height:48px;border-radius:12px;background:var(--chip);font-weight:500;font-size:14px}
.actbar button.pri{background:var(--blue);color:#fff}
.actbar button:disabled{opacity:.4}
.selhead{display:none;align-items:center;gap:10px;background:var(--blue-bg);color:var(--blue);padding:9px 18px;font-size:13px;flex:none}
.selmode .selhead{display:flex}
.selhead button{color:var(--blue);font-weight:700;margin-left:auto;font-size:13px}
.selhead .x{margin-left:0;color:var(--sub);font-weight:400}

/* sheet */
.dim{position:absolute;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;z-index:21;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px;flex:none}
.sheet .body{overflow-y:auto;padding:8px 20px 16px}
.sheet .foot2{padding:10px 20px 26px;display:flex;gap:8px;border-top:1px solid var(--line);flex:none}
.sheet .foot2 button{flex:1;height:52px;border-radius:14px;background:var(--chip);font-weight:700;font-size:15px}
.sheet .foot2 button.pri{background:var(--blue);color:#fff;flex:2}
.sheet .foot2 button:disabled{opacity:.4}
.sheet h3{font-size:19px;margin:6px 0 4px;letter-spacing:-.4px}
.sheet .desc{color:var(--sub);font-size:13px;margin:0 0 14px;line-height:1.6}
.ph{display:flex;gap:12px;align-items:center;margin:4px 0 14px}
.ph .thumb{width:60px;height:60px}
.ph .nm{font-weight:700;font-size:16px;line-height:1.35}
.ph .meta{font-size:12px;color:var(--muted);margin-top:2px}
.warnbox{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:12.5px;margin:12px 0 0;line-height:1.55}
.errbox{background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:6px}
.sitenote{font-size:12px;color:var(--muted);margin-top:14px}
.sec{font-size:13px;color:var(--sub);margin:16px 0 8px;display:flex;align-items:center}
.sec button{margin-left:auto;color:var(--blue);font-size:13px}
.segc{display:flex;background:var(--chip);border-radius:12px;padding:4px}
.segc button{flex:1;height:42px;border-radius:9px;font-weight:500;color:var(--sub)}
.segc button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.segc button.on.stopc{color:var(--red)}
.orow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border:0}
.orow .on1{flex:1;min-width:0}
.orow .on1 b{font-weight:500;display:block}
.orow .on1 span{font-size:12px;color:var(--muted)}
.orow .on1 span.z{color:var(--red)}
.orow.chg .on1 b::after{content:"●";color:var(--blue);font-size:8px;margin-left:5px;vertical-align:2px}
.step{display:flex;align-items:center;background:var(--chip);border-radius:10px;height:40px}
.step button{width:38px;height:40px;font-size:18px;color:var(--sub)}
.step input{width:56px;text-align:center;border:0;background:none;font-weight:700;font-size:15px;outline:none;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.step.big{height:54px;justify-content:space-between}
.step.big input{font-size:24px;width:120px}
.step.big button{width:60px;height:54px;font-size:24px}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);font-size:13px}
.soldbtn{font-size:12px;color:var(--red);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap}
.toast{position:absolute;left:16px;right:16px;bottom:88px;background:#2a2f36;color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;display:flex;align-items:center;gap:10px;z-index:30;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{margin-left:auto;color:#8db7ff;font-weight:700;white-space:nowrap}
/* chat */
.chatlist{flex:1;overflow-y:auto;padding:4px 0 90px;background:var(--card)}
.crow{display:flex;gap:12px;padding:12px 18px;align-items:center;width:100%;text-align:left}
.ava{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.crow .c{flex:1;min-width:0}.crow .c b{font-weight:500}.crow .c div{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .t{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.crow .t i{display:inline-block;background:var(--red);color:#fff;font-style:normal;border-radius:9px;padding:0 6px;font-size:11px;margin-top:4px}
.alertcard{margin:10px 14px;background:var(--bg);border-radius:16px;padding:14px}
.alertcard .h{font-size:12px;color:var(--sub);margin-bottom:6px}
.alertcard b{display:block;margin-bottom:8px}
.alertcard button{background:var(--blue);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700}
.nlist{flex:1;overflow-y:auto;padding:8px 14px 90px}
.nitem{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;font-size:13px;line-height:1.55}
.nitem b{display:block;font-size:14px;margin-bottom:2px}
.nitem span{color:var(--muted);font-size:12px}
.nitem.new{box-shadow:inset 3px 0 0 var(--blue)}
.nitem .go{color:var(--blue);font-weight:500}
.progress{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}

/* notes */
.notes{max-width:360px;color:var(--text)}
.notes h2{font-size:22px;margin:0 0 6px;letter-spacing:-.5px;line-height:1.35}
.notes p{color:var(--sub);margin:0 0 18px;font-size:14px}
.notes ol{padding:0;margin:0;list-style:none;counter-reset:n}
.notes li{counter-increment:n;padding:12px 0 12px 34px;position:relative;border-top:1px solid color-mix(in srgb,var(--sub) 25%,transparent);font-size:13.5px;line-height:1.6;color:var(--sub)}
.notes li::before{content:counter(n);position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--page);font-size:12px;font-weight:700;display:grid;place-items:center}
.notes li b{color:var(--text);display:block;font-size:14px}
.notes .try{margin-top:16px;font-size:13px;color:var(--sub);background:var(--card);border-radius:12px;padding:12px 14px;line-height:1.7}
@media (max-width:900px){.notes{display:none}}
@media (max-width:480px){
  body{padding:0;gap:0;justify-content:flex-start}
  .langbar{width:100%;border-radius:0;justify-content:center;box-shadow:none;border-bottom:1px solid var(--line)}
  .langbar button{flex:1;max-width:120px}
  .stage{flex:1;width:100%}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .sbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="langbar" id="langbar" role="group" aria-label="Language">
  <button data-lang="ko" class="on">한국어</button><button data-lang="zh">中文</button><button data-lang="en">English</button>
</div>

<div class="stage">
<div class="phone" id="phone">
  <div class="sbar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <section class="screen on" id="sc-prod">
    <div class="apphead">
      <div class="row"><h1 data-i18n="h_prod"></h1><span class="acct" data-i18n="acct"></span></div>
      <label class="search" id="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" enterkeyhint="search" autocomplete="off" data-i18n-ph="ph_search" data-i18n-aria="aria_search">
        <button class="clr" id="qclr" data-i18n-aria="aria_clear">✕</button></label>
    </div>
    <div class="chips" id="chips" role="tablist"></div>
    <div class="selhead" id="selhead"><button class="x" id="selExit">✕</button><span id="selTxt"></span><button id="selAll"></button></div>
    <div class="lbar" id="lbar"></div>
    <div class="list" id="list"></div>
    <div id="recentPane" class="list" style="display:none"></div>
  </section>

  <section class="screen" id="sc-chat">
    <div class="apphead"><div class="row"><h1 data-i18n="h_chat"></h1><span class="acct" data-i18n="ai_on"></span></div></div>
    <div class="chatlist" id="chatlist"></div>
  </section>

  <section class="screen" id="sc-noti">
    <div class="apphead"><div class="row"><h1 data-i18n="h_noti"></h1></div></div>
    <div class="nlist" id="nlist"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-sc="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-i18n="h_chat"></span><span class="dot">3</span></button>
    <button data-sc="prod" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/></svg><span data-i18n="h_prod"></span></button>
    <button data-sc="noti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span data-i18n="h_noti"></span><span class="dot" id="ndot" style="display:none">0</span></button>
  </nav>
  <div class="actbar" id="actbar"><button id="aStop" data-i18n="act_stop"></button><button id="aResume" data-i18n="act_resume"></button><button class="pri" id="aStock" data-i18n="act_stock"></button></div>

  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="body" id="sbody"></div><div class="foot2" id="sfoot"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" data-i18n="undo"></button></div>
</div>

<aside class="notes" id="notes"></aside>
</div>

<script>
/* ---------- i18n ---------- */
const I18N={
ko:{
 title:'PH2 · 모바일 상품관리 데모',
 h_prod:'상품관리',h_chat:'채팅',h_noti:'알림',acct:'G마켓 10 · 옥션 6 계정',ai_on:'AI 응대 켜짐',
 ph_search:'상품명, 상품번호, 판매자관리코드',aria_search:'상품 검색',aria_clear:'검색어 지우기',
 f_need:'확인 필요',f_out:'품절',f_low:'재고 10개 이하',f_on:'판매중',f_stop:'판매중지',f_all:'전체',
 need_desc:'판매중인데 품절됐거나 재고가 10개 이하인 상품이에요',
 sorts:['최근 수정순','최근 등록순','판매량 많은순'],

function makeProduct(id,q){

  sites:(s>>>27)%3===0?['G']:(s>>>27)%3===1?['A']:['G','A'],color:COLORS[(s>>>12)%COLORS.length],code:`${CODEP[b]}-${String(s%99999).padStart(5,'0')}`,edited:false};

 if(f==='need')return p.status==='on'&&n<=10;if(f==='low')return n>0&&n<=10;if(f==='out')return n===0;if(f==='on')return p.status==='on';if(f==='stop')return p.status==='stop';return true}
function itemAt(key,f,q,i){
 for(let k=0;k<80;k++){const id=String(4900000000+(h(key+':'+i+':'+k)%99999999));const p=makeProduct(id,q);if(matches(f,p))return p}

 const ts=st.items.filter(p=>st.sel.has(p.id)),snap=ts.map(p=>[p,JSON.parse(JSON.stringify({status:p.status,stock:p.stock,opts:p.opts,edited:p.edited}))]);
 ts.forEach(p=>{fn(p);p.edited=true});st.selMode=false;st.sel=new Set();render();
 showToast(t('done_n',{n:ts.length,label:lab(label)}),()=>{snap.forEach(([p,b])=>Object.assign(p,b));render();showToast(t('undone'))});
}
$('#aStop').onclick=()=>bulkStatus('stop');$('#aResume').onclick=()=>bulkStatus('on');$('#aStock').onclick=bulkStock;

/* ---------- tabs / alerts ---------- */
$('#tabbar').onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.sc)};
function go(sc){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='sc-'+sc));document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.sc===sc));if(sc==='noti'){newNoti=0;renderNoti();setTimeout(()=>notis.forEach(n=>n.new=false),1500)}}
function renderNoti(){
 $('#nlist').innerHTML=notis.map((n,i)=>{
  if(n.kind==='stock')return `<button class="nitem" data-ni="${i}"><b>${t('nt_stock')}</b>${t('nm_stock',{n:fmt(n.n)})} <span class="go">${t('n_go')}</span><br><span>${t(n.time)}</span></button>`;
  if(n.kind==='job')return `<div class="nitem"><b>${t('nt_job')}</b>${t('nm_job',{n:fmt(n.n),label:lab(n.label)})}<br><span>${t(n.time)}</span><div class="progress"><i style="width:${Math.min(100,n.pct)}%"></i></div></div>`;
  return `<div class="nitem ${n.new?'new':''}"><b>${t('nt_done')}</b>${t('nm_done',{label:lab(n.label),a:fmt(n.ok),b:fmt(n.fail)})}${n.fail?`<br>${t('nm_fail')}`:''}<br><span>${t(n.time)}</span></div>`;
 }).join('');
 $('#nlist').querySelectorAll('[data-ni]').forEach(b=>b.onclick=()=>{st.f='need';st.q='';$('#q').value='';$('#sbox').classList.remove('has');go('prod');reset()});
 const d=$('#ndot');d.style.display=newNoti?'block':'none';d.textContent=newNoti;
}

/* ---------- chat ---------- */
const alertP=makeProduct('4901215508');Object.assign(alertP,{nk:'nike',opts:[{k:'bk260',stock:2},{k:'bk265',stock:0},{k:'bk270',stock:7},{k:'wh260',stock:14}],stock:null,status:'on'});
const p2=makeProduct('4900876189');Object.assign(p2,{nk:'coke',opts:null,stock:640,status:'on',failOnce:true});
const AVA=['#e64980','#1098ad','#7048e8','#5c940d'],UNREAD=[1,0,2,0];
function renderChat(){
 $('#chatlist').innerHTML=`<div class="alertcard"><div class="h">${t('al_h')}</div><b>${t('al_b',{p:esc(pname(alertP)),o:optLabel('bk265')})}</b><button id="goFix">${t('al_btn')}</button></div>`+
  D('chats').map((r,i)=>`<button class="crow"><span class="ava" style="background:${AVA[i]}">${[...r[0]][0]}</span><span class="c"><b>${r[0]}</b><div>${r[1]}</div></span><span class="t">${r[2]}${UNREAD[i]?`<br><i>${UNREAD[i]}</i>`:''}</span></button>`).join('');
 $('#goFix').onclick=()=>{go('prod');openDetail(alertP)};
}

/* ---------- notes & language ---------- */
function renderNotes(){
 $('#notes').innerHTML=`<h2>${t('notes_h')}</h2><p>${t('notes_p')}</p><ol>${D('notes_li').map(x=>`<li>${x}</li>`).join('')}</ol><div class="try">${t('notes_try')}</div>`;
}
function applyLang(l){
 LANG=l;
 document.documentElement.lang={ko:'ko',zh:'zh-CN',en:'en'}[l];
 document.title=t('title');
 document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
 $('#sc-prod').setAttribute('aria-label',t('h_prod'));$('#sc-chat').setAttribute('aria-label',t('h_chat'));$('#sc-noti').setAttribute('aria-label',t('h_noti'));
 $('#toast').classList.remove('on');
 renderNotes();render();renderChat();renderNoti();
 if($('#recentPane').style.display==='block')showRecent(true);
 if(sheetFn&&$('#sheet').classList.contains('on'))sheetFn();
}
$('#langbar').onclick=e=>{const b=e.target.closest('[data-lang]');if(b&&b.dataset.lang!==LANG)applyLang(b.dataset.lang)};

applyLang('ko');reset();
</script>
