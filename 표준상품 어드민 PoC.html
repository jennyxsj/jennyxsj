<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>표준상품 어드민 PoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F3F4F1;--surface:#FFF;--ink:#17202A;--muted:#5E6973;--line:#DDE1DA;--soft:#EEF1EC;--side:#17202A;--side-ink:#E8ECEF;
--ok:#0B8A4B;--ok-bg:#DFF3E7;--warn:#A35F00;--warn-bg:#FCEFD6;--bad:#B8322A;--bad-bg:#FBE4E2;--info:#2F57C9;--info-bg:#E4EBFB;--auto:#5B3E8C;--auto-bg:#EEE7F8;
--e-bg:#F4F5F7;--e-line:#E3E5E8;--e-blue:#2C6BF2;--e-blue-bg:#EAF1FF;--e-red:#E2372F;--e-head:#202225;--e-ink:#222;--e-muted:#757B84;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111619;--surface:#1A2126;--ink:#E6EBEE;--muted:#98A4AD;--line:#2C363E;--soft:#222B31;--side:#0B0F12;--side-ink:#E6EBEE;
--ok:#3CCB7F;--ok-bg:#133626;--warn:#F2B04A;--warn-bg:#3A2A10;--bad:#F07167;--bad-bg:#3A1A18;--info:#8EAEFF;--info-bg:#1B2747;--auto:#C3A6F2;--auto-bg:#2A2140;
--e-bg:#121417;--e-line:#2B2F35;--e-blue:#6B9BFF;--e-blue-bg:#1A2742;--e-red:#FF6B62;--e-head:#0A0B0D;--e-ink:#E8EAED;--e-muted:#9AA1AA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111619;--surface:#1A2126;--ink:#E6EBEE;--muted:#98A4AD;--line:#2C363E;--soft:#222B31;--side:#0B0F12;--side-ink:#E6EBEE;
--ok:#3CCB7F;--ok-bg:#133626;--warn:#F2B04A;--warn-bg:#3A2A10;--bad:#F07167;--bad-bg:#3A1A18;--info:#8EAEFF;--info-bg:#1B2747;--auto:#C3A6F2;--auto-bg:#2A2140;
--e-bg:#121417;--e-line:#2B2F35;--e-blue:#6B9BFF;--e-blue-bg:#1A2742;--e-red:#FF6B62;--e-head:#0A0B0D;--e-ink:#E8EAED;--e-muted:#9AA1AA;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{padding:0 8px 16px;line-height:1.25}.brand b{display:block;font-size:15px}.brand span{font-size:12px;opacity:.6}
.navh{font-size:11px;opacity:.5;padding:14px 8px 4px;font-weight:600}
.nav{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--side-ink);opacity:.78}
.nav:hover{background:rgba(255,255,255,.07);opacity:1}.nav[aria-current="page"]{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
.side .foot{margin-top:auto;padding:12px 8px 0;font-size:12px;opacity:.6}.side .foot button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
main{overflow:auto;padding:22px 26px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}.head h1{font-size:21px}.head p{color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px}.kpi small{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:36px}
.in:focus{outline:2px solid var(--info);outline-offset:0;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}.btn.sm{padding:4px 9px;font-size:12px}.btn.del{color:var(--bad)}
.tw{overflow:auto;border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}.mut{color:var(--muted)}.sm{font-size:12px}.nowrap{white-space:nowrap}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-auto{background:var(--auto-bg);color:var(--auto)}.t-mut{background:var(--soft);color:var(--muted)}
.path{font-size:12px;color:var(--muted)}.path b{color:var(--ink);font-weight:600}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 12px;font-size:12px;color:var(--muted)}
.sc1{position:sticky;left:0;background:var(--surface);z-index:1}th.sc1{z-index:3;background:var(--soft)}
.sc2{position:sticky;left:110px;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}th.sc2{z-index:3;background:var(--soft)}
tr.click:hover .sc1,tr.click:hover .sc2{background:var(--soft)}
/* drawer */
.dim{position:fixed;inset:0;background:rgba(10,14,18,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:21;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
.dh{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.dh .t{flex:1;min-width:0}.dh h2{font-size:17px;line-height:1.35}
.sec{margin-top:18px}.sec h3{font-size:13px;color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
.gal{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}
.gal .big{border:1px solid var(--line);border-radius:10px;overflow:hidden;line-height:0;background:var(--soft)}
.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs button{border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;line-height:0;overflow:hidden}.thumbs button[aria-pressed="true"]{border-color:var(--info)}
.urls{display:flex;flex-direction:column;gap:8px;min-width:0}
.url{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;display:flex;gap:8px;align-items:center;min-width:0}
.url code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;color:var(--info)}
.url .k{flex:none;font-weight:600;color:var(--muted);width:44px}
.dimg{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px;line-height:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;background:var(--surface);font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* group browser */
.hier{display:flex;gap:10px;align-items:stretch;margin-bottom:14px;flex-wrap:wrap}
.hier .lv{flex:1;min-width:180px;padding:12px 14px}.hier .lv b{display:block}.hier .lv small{color:var(--muted)}
.hier .ar{align-self:center;color:var(--muted);font-size:18px}
.browse{display:grid;grid-template-columns:240px 300px minmax(0,1fr);gap:12px;align-items:start}
.tree{max-height:calc(100vh - 260px);overflow:auto;padding:6px 0}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px;border-radius:6px}
.node:hover{background:var(--soft)}.node[aria-current="true"]{background:var(--info-bg);font-weight:600}
.node .cnt{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.glist{max-height:calc(100vh - 300px);overflow:auto}
.li{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--soft)}.li[aria-current="true"]{background:var(--info-bg)}.li b{display:block;font-weight:600;font-size:13.5px}.li small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f label{font-size:12px;color:var(--muted);font-weight:600}.f .in{width:100%}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:1/-1}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.ttl h3{font-size:15px}
.bp{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.bph{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--soft)}.bph .t{flex:1;min-width:0}.bph b{display:block}
.specs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.specs span{font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 6px}
td .in{min-height:30px;padding:4px 8px;width:100%}
.ncell{min-width:170px}.ncell .in{width:100%}.ncell.empty .in{background:var(--bad-bg);border-color:transparent}.ncell.auto{color:var(--auto);font-size:12px}.ncell.seller{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

/* ===== ESM+ seller ===== */
.esm{display:none;height:100%;flex-direction:column;background:var(--e-bg);color:var(--e-ink)}
body.seller .app{display:none}body.seller .esm{display:flex}body.seller::before{background:var(--e-head)}
.etop{position:sticky;top:0;z-index:30;background:var(--e-head);color:#fff;display:flex;align-items:center;gap:22px;padding:0 22px;min-height:54px;flex:none}
.etop .logo{font-weight:800;font-size:18px}.etop .links{display:flex;gap:18px;font-size:14px;opacity:.72}.etop .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px}
.etop .back{background:#3A3D42;border:0;color:#fff;border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12px}
.ebody{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 316px;min-height:0}
.emenu{background:var(--surface);border-right:1px solid var(--e-line);padding:18px 16px;overflow:auto;font-size:14px}
.emenu h4{margin:0 0 10px;font-size:15px}.emenu a{display:block;color:var(--e-muted);padding:7px 0}.emenu a.on{color:var(--e-blue);font-weight:600}.emenu .grp{border-top:1px solid var(--e-line);padding:13px 0;font-weight:600}
.emain{overflow:auto;padding:24px 26px 120px;min-width:0;scroll-behavior:smooth}
.etitle{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}.etitle h1{font-size:26px}
.req::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--e-red);margin-left:6px;vertical-align:middle}
.types{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ty{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border-radius:99px;padding:4px 10px;background:var(--surface);border:1px solid var(--e-line)}
.ty i{width:9px;height:9px;border-radius:3px;display:inline-block}
.c-auto{background:#12A15A}.c-seller{background:var(--e-blue)}.c-def{background:#9AA0A8}.c-edit{background:#E39A16}.c-opt{background:var(--e-line)}
.stage{margin-top:22px;scroll-margin-top:10px}
.stage-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding:0 2px}
.stage-h b{font-size:13px;color:var(--e-muted);font-weight:600}.stage-h h2{font-size:18px}.stage-h span{margin-left:auto;font-size:12.5px;color:var(--e-muted)}
.esec{background:var(--surface);border:1px solid var(--e-line);border-radius:10px}
.esec.seller{box-shadow:inset 3px 0 0 var(--e-blue)}
.esec+.esec{margin-top:10px}
.esh{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--e-line)}.esh h3{font-size:16px}.esh .sum{margin-left:auto;color:var(--e-blue);font-size:12.5px;text-align:right}
.erow{display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:14px;padding:13px 22px;align-items:start}
.erow+.erow{border-top:1px solid var(--e-bg)}
.erow > .lb{padding-top:9px;font-size:14px}
.erow > .ac{padding-top:6px;display:flex;gap:6px;align-items:center}
.badge{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.b-auto{background:#E2F4EA;color:#0E8A4C}.b-edit{background:#FCEFD6;color:#A35F00}.b-seller{background:var(--e-blue-bg);color:var(--e-blue)}.b-def{background:var(--e-bg);color:var(--e-muted)}.b-lock{background:var(--e-bg);color:var(--e-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-auto{background:#133626;color:#3CCB7F}:root:not([data-theme="light"]) .b-edit{background:#3A2A10;color:#F2B04A}}
.einp{border:1px solid var(--e-line);border-radius:6px;padding:9px 12px;min-height:42px;width:100%;max-width:680px;background:var(--surface)}
.einp:focus{outline:2px solid var(--e-blue);outline-offset:-1px;border-color:transparent}
.is-auto .einp{background:#F1FAF5;border-color:#CDEBD9}.is-edit .einp{background:#FFF8EA;border-color:#F3D9A6}.is-err .einp{outline:2px solid var(--e-red);outline-offset:-1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .is-auto .einp{background:#132a20;border-color:#1f4a35}:root:not([data-theme="light"]) .is-edit .einp{background:#2d2410;border-color:#5a4318}}
.ro{padding:9px 0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ro .lockic{color:var(--e-muted);font-size:12px}
.ehint{font-size:12.5px;color:var(--e-blue);margin-top:6px}
.lnk{border:0;background:none;color:var(--e-blue);cursor:pointer;font-size:12.5px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.confirm{margin-top:8px;border:1px solid #F3C5C2;background:#FFF5F4;border-radius:8px;padding:10px 12px;font-size:13px;max-width:680px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .confirm{background:#2b1716;border-color:#5a2a27}}
.confirm .btns{display:flex;gap:8px;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--e-line);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:9px 16px;cursor:pointer;font-size:13.5px;min-width:90px}.seg button+button{border-left:1px solid var(--e-line)}.seg button[aria-pressed="true"]{background:var(--e-blue);color:#fff}
.ebtn{border:1px solid var(--e-line);background:var(--surface);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.ebtn.gray{background:#6E7277;color:#fff;border-color:#6E7277}.ebtn.blue{background:var(--e-blue);color:#fff;border-color:var(--e-blue)}.ebtn.sm{padding:5px 10px;font-size:12.5px}
.find{padding:18px 22px}
.find .row{display:flex;gap:8px;max-width:760px}.find .einp{font-size:16px;min-height:48px;max-width:none}
.eres{max-width:760px;margin-top:10px;border:1px solid var(--e-line);border-radius:8px;overflow:hidden;max-height:420px;overflow-y:auto}
.eres .gh{background:var(--e-bg);padding:7px 12px;font-size:12px;color:var(--e-muted)}
.eres button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--e-line);background:var(--surface);text-align:left;padding:8px 12px;cursor:pointer}
.eres button:hover{background:var(--e-blue-bg)}.eres .n{flex:1;min-width:0}.eres .n small{color:var(--e-muted);font-size:12px}
.picked{display:flex;gap:12px;align-items:center;max-width:760px;background:var(--e-blue-bg);border-radius:8px;padding:10px 12px}
.picked .t{flex:1;min-width:0}.picked small{color:var(--e-muted);font-size:12px}
.imgrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.imgbox{width:92px}.imgbox .im{width:92px;height:92px;border:1px solid var(--e-line);border-radius:6px;overflow:hidden;line-height:0;background:#fff;display:flex;align-items:center;justify-content:center}.imgbox small{display:block;font-size:11px;color:var(--e-muted);margin-top:3px;text-align:center}
.nl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 18px;max-width:880px}
.nl .ni{font-size:13px;display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px dashed var(--e-line)}.nl .ni span{color:var(--e-muted);font-size:12px}
details.esec > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:16px 22px}details.esec>summary::-webkit-details-marker{display:none}
details.esec > summary h3{font-size:16px}details.esec > summary .sum{margin-left:auto;color:var(--e-muted);font-size:12.5px}
.chev{width:26px;height:26px;border:1px solid var(--e-line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--e-muted)}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--e-line);display:flex;justify-content:flex-end;gap:10px;padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 12px)}
.ebar .ebtn{min-width:118px;padding:12px 16px;font-size:15px}
/* right rail — compact checklist */
.rail{padding:18px 16px 120px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.rc{background:var(--surface);border:1px solid var(--e-line);border-radius:12px;padding:14px 16px}
.rc h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}.rc h4 .pct{margin-left:auto;font-size:13px;color:var(--e-blue);font-weight:700;font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:99px;background:var(--e-bg);overflow:hidden;margin:10px 0 4px}.pbar i{display:block;height:100%;background:var(--e-blue);transition:width .35s}
.step{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 10px;position:relative}
.step + .step{margin-top:2px}
.step .rail-l{grid-row:1/3;display:flex;flex-direction:column;align-items:center}
.step .cir{width:14px;height:14px;border-radius:50%;border:2px solid #B9BEC5;background:var(--surface);margin-top:4px;flex:none}
.step.done .cir{background:#12A15A;border-color:#12A15A}.step.cur .cir{background:var(--e-blue);border-color:var(--e-blue)}
.step .ln{flex:1;width:2px;background:var(--e-line);margin:3px 0;min-height:14px}
.step:last-child .ln{display:none}

function lineCount(code){return db.lines.filter(l=>isUnder(l.sd,code)).length}
function drawTree(){
  const rows=[`<button class="node" data-act="gcat" data-code="" aria-current="${gcat===''}">전체<span class="cnt">${db.lines.length}</span></button>`];
  const walk=(parent,depth)=>children(parent).forEach(k=>{const kids=children(k.code).length;const open=gopen[k.code]||ancestors(gcat).includes(k.code);
    rows.push(`<button class="node" data-act="gcat" data-code="${esc(k.code)}" aria-current="${k.code===gcat}" style="padding-left:${10+depth*14}px">${kids?`<span aria-hidden="true" style="width:10px;color:var(--muted)">${open?'▾':'▸'}</span>`:'<span style="width:10px"></span>'}${esc(k.name)}<span class="cnt">${lineCount(k.code)||''}</span></button>`);
    if(kids&&open) walk(k.code,depth+1)});
  walk('',0); $('#tree').innerHTML=rows.join('');

function searchGroups(q){q=norm(q);if(!q)return [];const out=[];
  for(const l of db.lines){ if(groupHay(l).includes(q)||contsOf(l.id).some(c=>stdsOf(c.id).some(x=>norm(x.sp+x.code+x.bc).includes(q)))) out.push(l); if(out.length>=8)break }

function fuzzy(q){const toks=String(q||'').trim().split(/\s+/).filter(t=>t.length>=2&&!/^\d+(\.\d+)?(ml|l|g|kg|개|입|매|롤)?$/i.test(t));const grams=[];const nq=norm(toks.join(''));for(let i=0;i<nq.length-1;i++)grams.push(nq.slice(i,i+2));
  return db.lines.map(l=>{const h=groupHay(l);let sc=toks.filter(t=>h.includes(norm(t))).length*3+grams.filter(g=>h.includes(g)).length;return {l,sc}}).filter(x=>x.sc>=4).sort((a,b)=>b.sc-a.sc).slice(0,5).map(x=>x.l)}
const vLabel=(c,l)=>{const n=c.name.startsWith(l.name)?c.name.slice(l.name.length).trim():c.name;return n||[c.pk,per(c),c.fl,c.col].filter(Boolean).join(' ')}
function bestContent(l,q){const cs=contsOf(l.id);const nq=norm(q);return (cs.find(c=>nq&&norm(c.name).includes(nq))||cs.find(c=>nq&&nq.includes(norm(vLabel(c,l))))||cs[0]||{}).id}
function groupCard(l,q){const cs=contsOf(l.id);const b=BR(l.brand)||{};const k=CAT(l.sd)||{};const ns=cs.reduce((a,c)=>a+stdsOf(c.id).length,0);const open=pickL===l.id;

    h+=`<div class="picker">${cs.length>1?`<p class="pl">용량·형태</p><div class="chiprow">${cs.map(c=>`<button class="ochip" data-act="pickC" data-id="${esc(c.id)}" aria-pressed="${cc&&c.id===cc.id}">${esc(vLabel(c,l))}</button>`).join('')}</div>`:''}
    <p class="pl">구성</p><div class="chiprow">${ss.map(x=>`<button class="ochip" data-act="pickS" data-code="${esc(x.code)}" aria-pressed="${sel&&sel.code===x.code}">${x.q}${esc(x.qu)} <small>${esc(x.su)}</small></button>`).join('')||'<span class="sm" style="color:var(--e-muted)">판매 중인 구성이 없어요</span>'}</div>

  <div class="card tw"><table><thead><tr><th>등록 시각</th><th>상품명</th><th>표준상품코드</th><th>표준상품 연결</th><th class="num">셀러 입력</th><th class="num">자동</th><th class="num">기본값</th><th>셀러가 수정한 항목</th><th>PDP</th></tr></thead><tbody>${p.map(x=>`<tr><td class="mut">${new Date(x.at).toLocaleString('ko-KR')}</td><td>${esc(x.name)}</td><td>${esc(x.sp||'-')}</td><td>${x.link==='유지'?'<span class="tag t-ok">연결 유지</span>':x.link==='부분 수정'?'<span class="tag t-warn">유지 (부분 수정)</span>':x.link==='해제'?'<span class="tag t-bad">해제</span>':x.link==='요청 중'?'<span class="tag t-warn">등록 요청 중</span>':String(x.link).includes('요청 처리')?'<span class="tag t-ok">연결 (요청 처리)</span>':'<span class="tag t-mut">표준상품 없음</span>'}</td><td class="num">${x.seller}</td><td class="num">${x.auto}</td><td class="num">${x.def||0}</td><td>${esc((x.edited||[]).join(', ')||'-')}</td><td class="nowrap">${x.snap?`<button class="btn sm" data-act="openPdp" data-id="${esc(x.id)}">PDP 보기</button> <button class="btn sm" data-act="copy" data-u="${esc(pdpUrl(x))}">링크</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="card pad mut">아직 등록한 상품이 없어요. 상품 등록하기를 눌러 시작해 보세요.</div>`}`;
}

// ---------- events
let armed=null; function arm(btn,key,label,fn){ if(armed===key){armed=null;fn();return} armed=key;const o=btn.textContent;btn.textContent=label;setTimeout(()=>{if(armed===key){armed=null;btn.textContent=o}},2500) }
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ if(g.classList.contains('nav')&&g.dataset.go==='seller')doneP=null; go(g.dataset.go);return}
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='openStd'){galSel=0;openStd(b.dataset.code)}
  else if(a==='gal'){galSel=+b.dataset.k;openStd(b.dataset.code)}
  else if(a==='copy') copy(b.dataset.u);
  else if(a==='closeDrawer') closeDrawer();
  else if(a==='closeEdit'){closeDrawer();if(view==='groups'){drawGlist();drawGroup()}}
  else if(a==='lpg'){lpage+= +b.dataset.d;viewList._draw()}
  else if(a==='gpg'){gpage+= +b.dataset.d;drawGlist()}
  else if(a==='npg'){npage+= +b.dataset.d;viewNotice._draw()}
  else if(a==='toGroup'){selL=b.dataset.line;gcat='';go('groups')}
  else if(a==='toNotice'){ntpl=b.dataset.tpl||ntpl;npage=0;go('notice')}
  else if(a==='gcat'){const code=b.dataset.code; if(code&&code===gcat){gopen[code]=!gopen[code]} else {gcat=code; if(code) gopen[code]=true} gpage=0;drawTree();drawGlist()}
  else if(a==='selLine'){selL=b.dataset.id;drawGlist();drawGroup()}
  else if(a==='editCont') editCont(b.dataset.id);
  else if(a==='addLine'){const id='G-NEW'+Date.now().toString(36);const lc=leafCats();const sd=(gcat&&CAT(gcat)&&CAT(gcat).leaf)?gcat:((lc.find(k=>isUnder(k.code,gcat))||lc[0]).code);db.lines.unshift({id,name:'새 상품그룹',brand:db.brands[0].id,sd,pn:'',syn:'',kind:'신규',note:''});selL=id;dirty();drawTree();drawGlist();drawGroup();toast('상품그룹을 만들었어요. 이름과 브랜드를 바꿔 주세요')}
  else if(a==='addCont'){const id='C-NEW'+Date.now().toString(36);const b2=`${IMG_BASE}/${id.toLowerCase()}`;db.contents.push({id,line:selL,name:L(selL).name+' 새 기본상품',pk:'',ct:'',vol:null,vu:'',wt:null,wu:'',fl:'',col:'',model:'',etc:'',detail:'',img:`${b2}/main.jpg`,imgs:[],dimgs:[],dtype:'html',dhtml:'',isrc:'브랜드 제공',icopy:'Y',kind:'신규',note:''});db.notice[id]={};dirty();drawGlist();drawGroup();editCont(id)}
  else if(a==='delCont'){const cid=b.closest('[data-cid]').dataset.cid;arm(b,'c'+cid,'한 번 더 누르면 삭제',()=>{db.stds=db.stds.filter(s=>s.cid!==cid);db.contents=db.contents.filter(c=>c.id!==cid);delete db.notice[cid];dirty();closeDrawer();drawGlist();drawGroup();toast('기본상품을 삭제했어요')})}
  else if(a==='addStd'){const cid=b.closest('[data-cid]').dataset.cid;const c=C(cid);const last=stdsOf(cid).slice(-1)[0];db.seq=(db.seq||db.stds.length)+1;const code='N'+String(db.seq).padStart(7,'0');db.stds.push({code,sp:'SP'+String(1000000+db.seq),cid,name:c.name+' 1개',q:1,qu:last?last.qu:'개',su:'개',inner:0,size:'',bc:'',ptype:'제조사 포장',bundle:'',status:'사용',match:0,kind:'신규',memo:''});dirty();editCont(cid)}
  else if(a==='delStd'){const cid=b.closest('[data-cid]').dataset.cid;const code=b.closest('tr').dataset.code;arm(b,'s'+code,'확인',()=>{db.stds=db.stds.filter(s=>s.code!==code);dirty();editCont(cid)})}
  else if(a==='selTpl'){ntpl=b.dataset.tpl;npage=0;viewNotice()}
  else if(a==='mtab'){mtab=b.dataset.k;viewMaster()}
  else if(a==='selT'){selT=b.dataset.k;viewMaster()}
  else if(a==='dlTpl') downloadTpl(false);
  else if(a==='dlData') downloadTpl(true);
  else if(a==='uApply') applyUpload();
  else if(a==='uClear'){uParsed=null;drawUpload()}
  else if(a==='imgDel'){const all=[form.f.img.v].concat(form.f.imgs.v?form.f.imgs.v.split('\n'):[]).filter(Boolean);all.splice(+b.dataset.i,1);setImgs(all)}
  else if(a==='imgMain'){const all=[form.f.img.v].concat(form.f.imgs.v?form.f.imgs.v.split('\n'):[]).filter(Boolean);const [x]=all.splice(+b.dataset.i,1);all.unshift(x);setImgs(all)}
  else if(a==='imgAdd'){const i=$('#imgAdd');const u=i&&i.value.trim();if(!u){toast('이미지 URL을 넣어 주세요');return}const all=[form.f.img.v].concat(form.f.imgs.v?form.f.imgs.v.split('\n'):[]).filter(Boolean);if(all.length>=12){toast('이미지는 12장까지예요');return}all.push(u);setImgs(all)}
  else if(a==='dmode'){form.dmode=b.dataset.k;drawSeller()}
  else if(a==='dimgDel'){const l=htmlImgs(form.f.detail.v);l.splice(+b.dataset.i,1);setDetail(l.map((u,i)=>`<img src="${u}" alt="상세이미지 ${i+1}">`).join('\n'));drawSeller()}
  else if(a==='dimgAdd'){const i=$('#dimgAdd');const u=i&&i.value.trim();if(!u){toast('이미지 URL을 넣어 주세요');return}const l=htmlImgs(form.f.detail.v);l.push(u);setDetail(l.map((x,j)=>`<img src="${x}" alt="상세이미지 ${j+1}">`).join('\n'));drawSeller()}
  else if(a==='pickL'){if(pickL===b.dataset.id){pickL=null}else{const l=L(b.dataset.id);pickL=l.id;pickC=bestContent(l,sq);const ss=stdsOf(pickC);pickS=ss.length===1?ss[0].code:null}drawSeller()}
  else if(a==='pickC'){pickC=b.dataset.id;const ss=stdsOf(pickC);pickS=ss.length===1?ss[0].code:null;drawSeller()}
  else if(a==='pickS'){pickS=b.dataset.code;drawSeller()}
  else if(a==='noResult'){const el=$('#sres');if(el&&!el.querySelector('.nores')){el.insertAdjacentHTML('beforeend',noResultHtml([],true));b.closest('p').remove()}}
  else if(a==='bcSearch'){const v=norm(bcq);const hit=v&&db.stds.find(x=>norm(x.bc)===v);const el=$('#bcres');if(!el)return;if(hit){const c=C(hit.cid);el.innerHTML=`<div class="picked" style="margin-top:8px">${img(c,'main',40)}<div class="t"><b>${esc(hit.name)}</b><br><small>${esc(hit.sp)}</small></div><button class="ebtn blue sm" data-act="pick" data-code="${esc(hit.code)}">이 상품으로 등록</button></div>`}else el.innerHTML='<p class="sm" style="color:var(--e-muted);margin-top:6px">이 바코드로 등록된 표준상품이 없어요. 3번으로 진행해 주세요.</p>'}
  else if(a==='reqToggle'){form.request=b.checked;drawRail()}
  else if(a==='openPdp'){pdpId=b.dataset.id;pdpImg=0;pdpSite=b.dataset.site||'G';pdpBack=view==='seller'?'seller':'results';pdpTab='info';closeDrawer();go('pdp')}
  else if(a==='pdpImg'){pdpImg=+b.dataset.k;viewPdp()}
  else if(a==='pdpTab'){pdpTab=b.dataset.k;viewPdp()}
  else if(a==='mAgain'){closeDrawer();form=null;doneP=null;go('seller')}
  else if(a==='adTab'){adTab=+b.dataset.i;drawSeller()}
  else if(a==='mResults'){closeDrawer();doneP=null;go('results')}
  else if(a==='reqMake') reqMake(b.dataset.id);
  else if(a==='reqReject'){const r=db.requests.find(x=>x.id===b.dataset.id);r.status='반려';save();viewRequests()}
  else if(a==='pick'){form=buildForm(b.dataset.code);sTried=false;confirmKey=null;drawSeller();$('#emain').scrollTop=0}
  else if(a==='sManual'){form=manualForm();sTried=false;drawSeller()}
  else if(a==='sReset'||a==='sCancel'){form={code:null,f:{}};pickL=pickC=pickS=null;sTried=false;confirmKey=null;drawSeller()}
  else if(a==='sTemp') toast('임시저장했어요 (데모)');
  else if(a==='sTemp2') toast('배송정보 템플릿 변경은 데모에서 지원하지 않아요');
  else if(a==='sPrev') toast('미리보기는 데모에서 지원하지 않아요');
  else if(a==='askUnlock'){confirmKey=b.dataset.k;drawSeller();setTimeout(()=>{const r=$(`[data-row="${CSS.escape(b.dataset.k)}"]`);r&&r.scrollIntoView({block:'center'})},30)}
  else if(a==='unlockNo'){confirmKey=null;drawSeller()}
  else if(a==='unlock'){const x=form.f[b.dataset.k];x.unlocked=true;form.link='해제';confirmKey=null;drawSeller();toast('표준상품 연결을 해제했어요');setTimeout(()=>{const i=$(`[data-fk="${CSS.escape(b.dataset.k)}"]`);if(i){i.scrollIntoView({block:'center'});i.focus()}},30)}
  else if(a==='jump'){const el=$('#st-'+b.dataset.id);if(el){const d=el.querySelector('details');if(d)d.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}}
  else if(a==='register') register();
  else if(a==='reset'){arm(b,'reset','한 번 더 누르면 초기화',()=>{db=fresh();IX=null;save();form=null;go(view);toast('샘플 데이터로 되돌렸어요')})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawerRoot').innerHTML){closeDrawer();if(view==='groups')drawGroup()}});
function onEdit(e){
  const t=e.target;
  if(t.dataset.lf){const l=L(selL);l[t.dataset.lf]=t.value;dirty();if(e.type==='change'){drawTree();drawGlist();drawGroup()}return}
  if(t.dataset.cf){const cid=t.closest('[data-cid]').dataset.cid;const c=C(cid);const k=t.dataset.cf;if(k==='imgs'){c.imgs=t.value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,11)}else c[k]=(k==='vol'||k==='wt')?(t.value===''?null:+t.value):t.value;if(k==='dhtml'){const p=$('#dprevEdit');if(p)p.innerHTML=renderHtml(c.dhtml,c)}save();return}
  if(t.dataset.sf){const s=S(t.closest('tr').dataset.code);const k=t.dataset.sf;s[k]=k==='q'?(parseInt(t.value,10)||1):t.value;save();return}
  if(t.dataset.nitem){const cid=t.closest('tr').dataset.cid;(db.notice[cid]=db.notice[cid]||{})[t.dataset.nitem]=t.value;t.parentElement.classList.toggle('empty',!t.value);save();if(e.type==='change'){t.closest('tr').children[1].innerHTML=stTag(nStatus(C(cid)).st)}return}
  if(t.dataset.kf){const k=CAT(t.closest('tr').dataset.code);k[t.dataset.kf]=t.value;dirty();viewMaster();toast('카테고리 매핑을 바꿨어요');return}
  if(t.dataset&&t.dataset.rich&&form&&form.f){setDetail(serializeRich(t));const r=t.closest('[data-row]');if(r){r.classList.remove('is-err');const ac=r.querySelector('[data-badge]');const s=stOf(form.f.detail);if(ac)ac.innerHTML=s?BADGE[s]:''}drawRail();return}
  if(t.dataset.fk&&form&&form.f){const k=t.dataset.fk,x=form.f[k];if(!x)return;x.v=t.value; if(k==='detail'){const p=$('#dprev');if(p)p.innerHTML=renderHtml(x.v,form.code?C(S(form.code).cid):{name:'상품',pk:'박스',line:'',icopy:'Y'})}
    if(form.code&&form.link==='유지'&&x.type==='auto'&&x.v!==x.std&&POL[k]==='edit')form.link='부분 수정';
    const row=t.closest('[data-row]');if(row){const s=stOf(x);row.classList.toggle('is-auto',s==='auto');row.classList.toggle('is-edit',s==='edit');if(x.v)row.classList.remove('is-err');const ac=row.querySelector('[data-badge]');if(ac&&!isLocked(k,x))ac.innerHTML=s?BADGE[s]:''}
    drawRail(); const tys=$$('.types .ty'); if(tys.length){const c=cnt();[c.auto,c.seller+c.empty,c.def,c.edit].forEach((n,i)=>{tys[i].lastChild.textContent=' '+n})}
    return}
}
document.addEventListener('input',onEdit); document.addEventListener('focusin',e=>{}); document.addEventListener('change',onEdit);

})();
